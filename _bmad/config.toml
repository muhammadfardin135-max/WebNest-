# BMad central config.
#
# Normally written by `npx bmad-method install`. Written by hand here because the
# skills are vendored into .claude/skills/ rather than installed as a plugin —
# see docs/vendored-skills.md.
#
# CHANGE user_name BELOW to whatever you want the BMad agents to call you.
# It is left at the upstream default because nobody supplied a real value.

[core]
user_name = "BMad"
project_name = "WebNest-"
communication_language = "English"
document_output_language = "English"
# Everything BMad writes stays under _bmad-output/ so it never lands in
# numbers/, decisions/ or docs/, which are hand-curated.
output_folder = "{project-root}/_bmad-output"

[bmm]
# CLAUDE.md states the repo owner is not a developer, so BMad's dev-concept
# explanations are set to the fullest level.
user_skill_level = "beginner"
planning_artifacts = "{project-root}/_bmad-output/planning-artifacts"
implementation_artifacts = "{project-root}/_bmad-output/implementation-artifacts"
project_knowledge = "{project-root}/_bmad-output/knowledge"
